[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-status-discord-updates"
version = "1.51.0"
description = "Opt-in WoW character milestones and Discord status"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "discord.py>=2.6,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-xdist>=3.6,<4", "ruff>=0.14,<1", "lupa>=2.6,<3"]

[project.scripts]
wow-status = "wow_status.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One worker per CPU; worksteal keeps the slow homepage tests from piling up on one
# worker. -n 0 runs everything in one process, e.g. for a debugger. Needs pytest-xdist
# from the dev extras: pip install -e '.[dev]'.
addopts = "-n auto --dist worksteal"
# Deleting every passed test's folder runs in parallel in the workers; otherwise the
# next run deletes a whole earlier run (hundreds of MB) alone at the end.
tmp_path_retention_policy = "failed"
# Only raised under PYTHONWARNDEFAULTENCODING=1 (set in CI); see tests/test_text_encoding.py.
filterwarnings = ["error::EncodingWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
wow_status = ["group_fold.json"]
