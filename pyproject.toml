[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-status-discord-updates"
version = "0.5.0"
description = "Opt-in WoW character milestones and Discord status"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "discord.py>=2.6,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "lupa>=2.6,<3"]

[project.scripts]
wow-status = "wow_status.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
