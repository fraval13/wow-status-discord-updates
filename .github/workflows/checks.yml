name: Checks and addon packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Package both standalone addons
        shell: python
        run: |
          import shutil
          from pathlib import Path
          Path('dist').mkdir(exist_ok=True)
          for client in ('vanilla', 'forever'):
              shutil.make_archive(f'dist/WoWStatus-{client}', 'zip', f'addon/{client}', 'WoWStatus')
      - uses: actions/upload-artifact@v4
        with:
          name: WoWStatus-addons-${{ matrix.os }}
          path: dist/*.zip
