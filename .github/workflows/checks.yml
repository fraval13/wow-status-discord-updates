name: Checks and addon packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Test on Windows too (about 15 minutes)
        type: boolean
        default: false
permissions:
  contents: read
# Third-party actions are pinned to a full commit SHA (the comment names its tag), and
# no checkout keeps the job's GitHub token in .git/config (issue #27).
# Off `main`, a new push cancels the ref's older run. On `main` every run has its own
# group, so validation is never queued or cancelled there; `deploy-gate` and the
# `deploy` job's own concurrency group keep an older commit from deploying over a
# newer one (issue #15).
concurrency:
  group: checks-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  release:
    # Trusted main only. PR validation has no write token and never prepares a release.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: character-status-release
      cancel-in-progress: false
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare one minor release, or reuse the existing release on retry
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/prepare_release.py --revision "$SOURCE_REVISION"
  validate:
    needs: release
    if: always() && !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    # Windows takes about 15 minutes, mostly the two test runs. Pull requests test on
    # both systems; the Windows check does not block merging, so it can be skipped
    # there. A main release already passed it in its pull request, so it tests on
    # Ubuntu only and deploys sooner. A manual run tests on Windows when asked to.
    strategy:
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || inputs.windows) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.revision || github.sha }}
      # The oldest supported Python, for the receiver mirror below: the server's venv uses its
      # own python3, and the lock has entries only older versions install.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # The locked versions last, replacing any the dev extras pulled in, so the tests run
      # what the server installs; pip check then fails if a dev tool needs another version.
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - run: python -m pip check
      - name: Install the locked release exactly as the server's receiver does
        if: runner.os == 'Linux'
        # Same tracked files and pip steps as deploy/install_release.py, on Python 3.11;
        # pip check fails when requirements.txt misses a dependency.
        run: |
          release="$RUNNER_TEMP/release"
          mkdir "$release"
          git archive HEAD | tar -x -C "$release"
          python3.11 -m venv "$release/.venv"
          pip=("$release/.venv/bin/python" -m pip install --disable-pip-version-check --no-input)
          "${pip[@]}" --require-hashes --only-binary :all: -r "$release/requirements.txt"
          "${pip[@]}" --no-deps --no-build-isolation --no-index "$release"
          "$release/.venv/bin/python" -m pip check
          "$release/.venv/bin/python" -c 'import wow_status.cli'
      - name: Check every addon TOC declares the pyproject version
        run: python scripts/sync_version.py --check
      # The homepage ships website/ as it stands, so a script that does not parse
      # would deploy and break the page with nothing red here (#121). The font
      # licence is third-party text and keeps its own trailing spaces.
      - name: Lint, parse the website scripts and check whitespace
        shell: bash
        run: |
          ruff check src tests scripts
          for script in website/*.js; do node --check "$script"; done
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':(exclude)website/assets/fonts'
      # The slowest tests are listed, so a slow runner (Windows) shows where time goes.
      - run: python -m pytest -q --durations=15
        env:
          # Fail on any text I/O that falls back to the locale encoding (cp1252 on
          # Windows), including in scripts the tests start as subprocesses.
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Run the tests again under Lua 5.1, the version every WoW client runs
        run: python -m pytest -q --lua=5.1 --durations=15
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Build homepage and verified addon downloads
        run: python scripts/build_homepage.py --addon-ref HEAD
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Package standalone addons
        shell: python
        run: |
          import shutil
          from pathlib import Path
          Path('dist').mkdir(exist_ok=True)
          for client in ('vanilla', 'forever', 'tbc', 'retail'):
              shutil.copyfile(f'dist/homepage/downloads/WoWStatus-{client}.zip', f'dist/WoWStatus-{client}.zip')
          shutil.make_archive('dist/WoWStatus-discord-emojis', 'zip', 'assets/discord-emojis')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WoWStatus-addons-${{ matrix.os }}
          path: dist/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WoWStatus-homepage-${{ matrix.os }}
          path: dist/homepage/
  deploy-gate:
    # Runs before `deploy` joins the production group: a run whose commit is no longer
    # the tip of `main` must not wait there, because a newly waiting deploy cancels the
    # one already waiting, which would be the newer commit's. A newer commit's deploy
    # that arrives while this one waits cancels this one, so deploys stay in order.
    needs: [release, validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ needs.release.outputs.revision }}
      current: ${{ steps.gate.outputs.current }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.revision }}
          sparse-checkout: scripts/deploy_gate.py
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
        run: python3 scripts/deploy_gate.py --revision "$RELEASE_REVISION"
  deploy:
    needs: deploy-gate
    if: needs.deploy-gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    # Deploy secrets can move into this environment and be limited to main there
    # (deploy/SERVER.md); until then the job reads the repository secrets as before.
    environment:
      name: production
      url: https://wow.frankvalde.com
    concurrency:
      # "Re-run failed jobs" reuses an earlier attempt's gate result, which may be
      # stale. Such a re-run gets a group of its own, so it can't cancel a newer
      # waiting deploy, and its first step fails.
      group: ${{ needs.deploy-gate.outputs.attempt == github.run_attempt && 'character-status-production' || format('character-status-rerun-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Refuse a partial re-run
        if: needs.deploy-gate.outputs.attempt != github.run_attempt
        run: |
          echo '::error title=Use "Re-run all jobs"::"Re-run failed jobs" does not re-check that this commit is still the tip of main, so it cannot deploy. Use "Re-run all jobs" on the run for the current tip of main.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.deploy-gate.outputs.revision }}
      # No setup-python: this job holds the deploy key and bot tokens, so after checkout it
      # runs only this commit's own standard-library scripts, on the runner image's python3.
      - name: Build homepage for this release
        run: python3 scripts/build_homepage.py --addon-ref HEAD
      - name: Prepare private deployment archive
        env:
          # One JSON secret keyed by the server's private group instances, so no group
          # name appears here. Unset keeps the server's Discord settings (deploy/SERVER.md).
          WOW_STATUS_DISCORD_CONFIG: ${{ secrets.WOW_STATUS_DISCORD_CONFIG }}
        run: python3 deploy/make_release.py "$RUNNER_TEMP/wow-character-release.tar"
      - name: Deploy using restricted project key
        env:
          DEPLOY_KEY: ${{ secrets.WOW_STATUS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WOW_STATUS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.WOW_STATUS_SSH_HOST }}
        run: bash deploy/send_to_receiver.sh "$RUNNER_TEMP/wow-character-release.tar"
      - name: Verify live homepage and all addon downloads
        id: verify
        env:
          RELEASE_REVISION: ${{ needs.deploy-gate.outputs.revision }}
        # Compare the live site with the release.json this job built, not only with the
        # manifest the site serves, which a tampered site could regenerate. Status 4 means
        # the site answered with something other than this release; any other failure
        # (unreachable site, verifier error) is one a rollback would not fix.
        run: |
          status=0
          python3 scripts/verify_homepage.py --url https://wow.frankvalde.com \
            --revision "$RELEASE_REVISION" --manifest dist/homepage/downloads/release.json \
            --attempts 6 || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Roll back to the previous release
        # The receiver restores the release (and homepage) it replaced, but only while this
        # commit's release is still the live one. The job stays red either way.
        if: failure() && steps.verify.outcome == 'failure' && steps.verify.outputs.status == '4'
        env:
          DEPLOY_KEY: ${{ secrets.WOW_STATUS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WOW_STATUS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.WOW_STATUS_SSH_HOST }}
          RELEASE_REVISION: ${{ needs.deploy-gate.outputs.revision }}
        run: |
          printf 'wow-status-rollback %s\n' "$RELEASE_REVISION" > "$RUNNER_TEMP/wow-character-rollback"
          if ! bash deploy/send_to_receiver.sh "$RUNNER_TEMP/wow-character-rollback"; then
            echo '::error title=Not rolled back::The receiver did not roll back; its reason is in the log above. A receiver installed before issue #27 cannot roll back at all (deploy/SERVER.md).'
            exit 1
          fi
      - name: Report Discord bot state
        # Warns, never fails: ingestion stays up when Discord is down, so the deploy
        # passes and a revoked token or removed bot shows here instead.
        continue-on-error: true
        env:
          RELEASE_REVISION: ${{ needs.deploy-gate.outputs.revision }}
          # Route keys are private; each instance's optional "route" says which to check.
          WOW_STATUS_DISCORD_CONFIG: ${{ secrets.WOW_STATUS_DISCORD_CONFIG }}
        run: python3 scripts/report_discord_state.py --url https://wow.frankvalde.com --revision "$RELEASE_REVISION"
  curseforge:
    # Publishes the release that `deploy` just verified on the homepage to CurseForge,
    # one file per edition (scripts/upload_curseforge.py, docs/CURSEFORGE.md). Does
    # nothing until the CURSEFORGE_PROJECT_ID variable is set. Re-running a successful
    # upload uploads the files again, so re-run only after a failed upload.
    needs: [deploy-gate, deploy]
    if: needs.deploy.result == 'success' && vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: character-status-curseforge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.deploy-gate.outputs.revision }}
      - name: Build addon packages for this release
        run: python3 scripts/build_homepage.py --addon-ref HEAD
      - name: Upload to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 scripts/upload_curseforge.py --downloads dist/homepage/downloads
