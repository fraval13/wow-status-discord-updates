name: Checks and addon packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One run at a time per branch or PR, so runs for `main` reach `deploy` in push order.
# On `main` a running run is never cancelled, and a newer push replaces any older run
# still waiting. On other refs a new push cancels the old run. The `deploy` job's
# guard below also stops a re-run of an old run from deploying.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          # Fail on any text I/O that falls back to the locale encoding (cp1252 on
          # Windows), including in scripts the tests start as subprocesses.
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Run the tests again under Lua 5.1, the version every WoW client runs
        run: python -m pytest -q --lua=5.1
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Build homepage and verified addon downloads
        run: python scripts/build_homepage.py --addon-ref HEAD
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Package standalone addons
        shell: python
        run: |
          import shutil
          from pathlib import Path
          Path('dist').mkdir(exist_ok=True)
          for client in ('vanilla', 'forever', 'tbc', 'retail'):
              shutil.copyfile(f'dist/homepage/downloads/WoWStatus-{client}.zip', f'dist/WoWStatus-{client}.zip')
          shutil.make_archive('dist/WoWStatus-discord-emojis', 'zip', 'assets/discord-emojis')
      - uses: actions/upload-artifact@v4
        with:
          name: WoWStatus-addons-${{ matrix.os }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WoWStatus-homepage-${{ matrix.os }}
          path: dist/homepage/
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: character-status-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Skip the deploy if main has moved past this commit
        id: still-main
        env:
          RELEASE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Deploy jobs run one at a time (the job's `concurrency` group), so a newer
          # commit cannot deploy between this check and this job's upload.
          main_revision="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$main_revision" = "$RELEASE_REVISION" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            message="Not deploying $RELEASE_REVISION because main is now $main_revision, which its own run deploys. To roll back, revert on main instead of re-running an old run."
            echo "::notice title=Deploy skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.still-main.outputs.current == 'true'
        with:
          python-version: '3.13'
      - name: Build homepage for this release
        if: steps.still-main.outputs.current == 'true'
        run: python scripts/build_homepage.py --addon-ref HEAD
      - name: Prepare private deployment archive
        if: steps.still-main.outputs.current == 'true'
        env:
          RONKALOT_DISCORD_BOT_TOKEN: ${{ secrets.RONKALOT_DISCORD_BOT_TOKEN }}
          RONKALOT_DISCORD_GUILD_ID: ${{ vars.RONKALOT_DISCORD_GUILD_ID }}
          RONKALOT_DISCORD_CHANNEL_ID: ${{ vars.RONKALOT_DISCORD_CHANNEL_ID }}
          NAVSQUAD_DISCORD_BOT_TOKEN: ${{ secrets.NAVSQUAD_DISCORD_BOT_TOKEN }}
          NAVSQUAD_DISCORD_GUILD_ID: ${{ vars.NAVSQUAD_DISCORD_GUILD_ID }}
          NAVSQUAD_DISCORD_CHANNEL_ID: ${{ vars.NAVSQUAD_DISCORD_CHANNEL_ID }}
        run: python deploy/make_release.py "$RUNNER_TEMP/wow-character-release.tar"
      - name: Deploy using restricted project key
        if: steps.still-main.outputs.current == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.WOW_STATUS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WOW_STATUS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.WOW_STATUS_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/wow-character-key"
          host_file="$RUNNER_TEMP/wow-character-known-hosts"
          trap 'rm -f "$key_file" "$host_file" "$RUNNER_TEMP/wow-character-release.tar"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$host_file"
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$host_file" -o IdentitiesOnly=yes -i "$key_file" \
            "wow-character-deploy@$DEPLOY_HOST" < "$RUNNER_TEMP/wow-character-release.tar"
      - name: Verify live homepage and all addon downloads
        if: steps.still-main.outputs.current == 'true'
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: python scripts/verify_homepage.py --url https://wow.frankvalde.com --revision "$RELEASE_REVISION" --attempts 6
