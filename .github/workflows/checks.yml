name: Checks and addon packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Off `main`, a new push cancels the ref's older run. On `main` every run has its own
# group, so validation is never queued or cancelled there; `deploy-gate` and the
# `deploy` job's own concurrency group keep an older commit from deploying over a
# newer one (issue #15).
concurrency:
  group: checks-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Check every addon TOC declares the pyproject version
        run: python scripts/sync_version.py --check
      - run: python -m pytest -q
        env:
          # Fail on any text I/O that falls back to the locale encoding (cp1252 on
          # Windows), including in scripts the tests start as subprocesses.
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Run the tests again under Lua 5.1, the version every WoW client runs
        run: python -m pytest -q --lua=5.1
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Build homepage and verified addon downloads
        run: python scripts/build_homepage.py --addon-ref HEAD
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
      - name: Package standalone addons
        shell: python
        run: |
          import shutil
          from pathlib import Path
          Path('dist').mkdir(exist_ok=True)
          for client in ('vanilla', 'forever', 'tbc', 'retail'):
              shutil.copyfile(f'dist/homepage/downloads/WoWStatus-{client}.zip', f'dist/WoWStatus-{client}.zip')
          shutil.make_archive('dist/WoWStatus-discord-emojis', 'zip', 'assets/discord-emojis')
      - uses: actions/upload-artifact@v4
        with:
          name: WoWStatus-addons-${{ matrix.os }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WoWStatus-homepage-${{ matrix.os }}
          path: dist/homepage/
  deploy-gate:
    # Runs before `deploy` joins the production group: a run whose commit is no longer
    # the tip of `main` must not wait there, because a newly waiting deploy cancels the
    # one already waiting, which would be the newer commit's. A newer commit's deploy
    # that arrives while this one waits cancels this one, so deploys stay in order.
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.gate.outputs.current }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deploy_gate.py
          sparse-checkout-cone-mode: false
      - id: gate
        run: python3 scripts/deploy_gate.py --revision "$GITHUB_SHA"
  deploy:
    needs: deploy-gate
    if: needs.deploy-gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # "Re-run failed jobs" reuses an earlier attempt's gate result, which may be
      # stale. Such a re-run gets a group of its own, so it can't cancel a newer
      # waiting deploy, and its first step fails.
      group: ${{ needs.deploy-gate.outputs.attempt == github.run_attempt && 'character-status-production' || format('character-status-rerun-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Refuse a partial re-run
        if: needs.deploy-gate.outputs.attempt != github.run_attempt
        run: |
          echo '::error title=Use "Re-run all jobs"::"Re-run failed jobs" does not re-check that this commit is still the tip of main, so it cannot deploy. Use "Re-run all jobs" on the run for the current tip of main.'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build homepage for this release
        run: python scripts/build_homepage.py --addon-ref HEAD
      - name: Prepare private deployment archive
        env:
          # One JSON secret keyed by the server's private group instances, so no group
          # name appears here. Unset keeps the server's Discord settings (deploy/SERVER.md).
          WOW_STATUS_DISCORD_CONFIG: ${{ secrets.WOW_STATUS_DISCORD_CONFIG }}
        run: python deploy/make_release.py "$RUNNER_TEMP/wow-character-release.tar"
      - name: Deploy using restricted project key
        env:
          DEPLOY_KEY: ${{ secrets.WOW_STATUS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WOW_STATUS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.WOW_STATUS_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/wow-character-key"
          host_file="$RUNNER_TEMP/wow-character-known-hosts"
          trap 'rm -f "$key_file" "$host_file" "$RUNNER_TEMP/wow-character-release.tar"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$host_file"
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$host_file" -o IdentitiesOnly=yes -i "$key_file" \
            "wow-character-deploy@$DEPLOY_HOST" < "$RUNNER_TEMP/wow-character-release.tar"
      - name: Verify live homepage and all addon downloads
        env:
          RELEASE_REVISION: ${{ github.sha }}
        # Compare the live site with the release.json this job built, not only with the
        # manifest the site serves, which a tampered site could regenerate.
        run: >-
          python scripts/verify_homepage.py --url https://wow.frankvalde.com
          --revision "$RELEASE_REVISION" --manifest dist/homepage/downloads/release.json
          --attempts 6
      - name: Report Discord bot state
        # Warns, never fails: ingestion stays up when Discord is down, so the deploy
        # passes and a revoked token or removed bot shows here instead.
        continue-on-error: true
        env:
          RELEASE_REVISION: ${{ github.sha }}
          # Route keys are private; each instance's optional "route" says which to check.
          WOW_STATUS_DISCORD_CONFIG: ${{ secrets.WOW_STATUS_DISCORD_CONFIG }}
        run: python scripts/report_discord_state.py --url https://wow.frankvalde.com --revision "$RELEASE_REVISION"
