<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WoW Status light rendering source</title>
<style>html,body{margin:0;width:1440px;height:480px;overflow:hidden;background:#101827}svg{display:block;width:1440px;height:480px}</style></head><body>
<!-- Original artwork stays fixed; only the existing lights brighten gently. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2172 724">
 <defs>
  <radialGradient id="warm"><stop offset="0" stop-color="#ffe6aa" stop-opacity=".45"/><stop offset=".35" stop-color="#ffc263" stop-opacity=".18"/><stop offset="1" stop-color="#f09634" stop-opacity="0"/></radialGradient>
  <radialGradient id="blue"><stop offset="0" stop-color="#d7f3ff" stop-opacity=".4"/><stop offset=".35" stop-color="#72d9ff" stop-opacity=".15"/><stop offset="1" stop-color="#50baff" stop-opacity="0"/></radialGradient>
 </defs>
 <image href="/website/assets/adventure.webp" width="2172" height="724"/>
 <ellipse class="light" fill="url(#warm)" cx="1760" cy="319" rx="48" ry="48"/>
 <ellipse class="light" fill="url(#warm)" cx="2006" cy="298" rx="44" ry="44"/>
 <ellipse class="light" fill="url(#warm)" cx="2052" cy="412" rx="25" ry="30"/>
 <ellipse class="light" fill="url(#blue)" cx="1845" cy="422" rx="18" ry="22"/>
</svg>
<script>
window.renderFrame = function(frame) {
 const phase = 2 * Math.PI * frame / 240;
 document.querySelectorAll('.light').forEach((light, i) => {
  light.setAttribute('opacity', .42 + .18*Math.sin(phase*3+i*1.7) + .09*Math.sin(phase*7+i*.9));
 });
};
window.renderFrame(0);
</script></body></html>
